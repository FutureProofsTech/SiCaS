name: release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag
        required: true
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: "1.99.0"

      - name: Verify the release tag points at the checked-out commit
        env:
          # Pass the tag through the environment. Direct `${{ }}` interpolation
          # into a shell script would evaluate command substitutions in a
          # tag name.
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          tag="$RELEASE_TAG"
          test -n "$tag"
          test "$(git rev-parse "refs/tags/${tag}^{commit}")" = "$(git rev-parse HEAD)"

      - name: Build release manifest
        run: python3 tools/release_manifest.py --output release

      - name: Verify checksums and metadata
        run: |
          cd release
          sha256sum -c SHA256SUMS
          python3 -m json.tool sbom.cdx.json >/dev/null
          python3 -m json.tool provenance.json >/dev/null

      - name: Validate release manifest
        run: python3 tools/validate_release_manifest.py --manifest release

      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: release/sicas-harness

      - name: Install cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3

      - name: Sign release artifact
        run: |
          cosign sign-blob --yes \
            --bundle release/sicas-harness.sigstore.json \
            release/sicas-harness

      - name: Upload release artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sicas-release
          path: release/

      - name: Create draft release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          draft: true
          files: release/*
