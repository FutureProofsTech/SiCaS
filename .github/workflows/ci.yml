name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-08-03
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-08-03
          components: clippy
      - run: cargo +nightly-2026-08-03 clippy --workspace --all-targets --all-features --locked -- -D warnings -D clippy::pedantic -D clippy::nursery

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.0"
      - run: cargo test --workspace --all-targets --all-features --locked
      - run: cargo test --workspace --doc --locked

  miri:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-08-03
          components: miri
      - run: cargo +nightly-2026-08-03 miri test --workspace

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.0"
      - run: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps --all-features --locked

  kani:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: model-checking/kani-github-action@v1
        with:
          kani-version: "0.68.0"
          args: --workspace

  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-08-03
      - name: AddressSanitizer
        run: RUSTFLAGS="-Zsanitizer=address" cargo +nightly-2026-08-03 test --workspace --lib --target x86_64-unknown-linux-gnu

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-08-03
      - run: cargo install cargo-fuzz --locked
      - run: cargo +nightly-2026-08-03 fuzz run masked_ops -- -runs=10000
      - run: cargo +nightly-2026-08-03 fuzz run ct_lookup -- -runs=10000
      - run: cargo +nightly-2026-08-03 fuzz run trace_parser -- -runs=10000
      - run: cargo +nightly-2026-08-03 fuzz run chacha20 -- -runs=10000

  mutation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.0"
      - run: cargo install cargo-mutants --locked
      - run: cargo mutants --workspace --no-shuffle

  cross:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - thumbv7em-none-eabihf
          - riscv32imac-unknown-none-elf
          - aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.0"
          targets: ${{ matrix.target }}
      - run: cargo check -p sicas-core --lib --target ${{ matrix.target }} --locked
      - run: cargo check -p sicas-reference --lib --target ${{ matrix.target }} --locked

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-08-03
          components: llvm-tools-preview
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - run: cargo llvm-cov --workspace --all-features --fail-under-lines 90 --lcov --output-path lcov.info

  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.0"
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit,cargo-deny
      - run: cargo audit
      - run: cargo deny check

  release-dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.0"
      - run: python3 tools/release_manifest.py --output "$RUNNER_TEMP/release"
      - run: cd "$RUNNER_TEMP/release" && sha256sum -c SHA256SUMS
      - run: python3 -m json.tool "$RUNNER_TEMP/release/sbom.cdx.json" >/dev/null
      - run: python3 -m json.tool "$RUNNER_TEMP/release/provenance.json" >/dev/null

  reproducible:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.0"
      - run: CARGO_TARGET_DIR="$RUNNER_TEMP/repro1" cargo build --workspace --release --locked
      - run: CARGO_TARGET_DIR="$RUNNER_TEMP/repro2" cargo build --workspace --release --locked
      - run: cmp "$RUNNER_TEMP/repro1/release/sicas-harness" "$RUNNER_TEMP/repro2/release/sicas-harness"

  asm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.0"
          targets: thumbv7em-none-eabihf,riscv32imac-unknown-none-elf,aarch64-unknown-linux-gnu
      - run: python3 tools/ct_asm_check.py --output evidence/ct/asm-ci.md

  no-deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.0"
      - name: Verify zero third-party runtime dependencies
        run: |
          cargo metadata --format-version 1 --no-deps | python3 -c '
          import json
          import sys

          metadata = json.load(sys.stdin)
          members = {package["name"] for package in metadata["packages"]}
          failed = False
          for package in metadata["packages"]:
              for dependency in package["dependencies"]:
                  if dependency["name"] not in members:
                      print(
                          "non-workspace dependency: "
                          + package["name"]
                          + " -> "
                          + dependency["name"],
                          file=sys.stderr,
                      )
                      failed = True
          sys.exit(1 if failed else 0)
          '
